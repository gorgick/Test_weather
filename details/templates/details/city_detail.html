<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="container mt-5">
    <div class="row">
        <div class="col-md-4">
            <h3>{{city.name}}</h3>
        </div>
        <div class="col-md-8">
            <table class="table">
                <thead>
                <tr>
                    <th scope="col">Descripton</th>
                    <th scope="col">Data</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td>Country</td>
                    <td>{{ city.country }}</td>
                </tr>
                <tr>
                    <td>Temperature</td>
                    <td>{{ city.temp }} &deg;C</td>
                </tr>
                <tr>
                    <td>Wind</td>
                    <td>{{ city.wind }} m/s</td>
                </tr>
                <tr>
                    <td>Weather</td>
                    <td>{{ city.weather }}</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
